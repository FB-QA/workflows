name: Claude code review (reusable)

# Central reusable PR-review workflow for FB-QA repos. Callers reference it as
#   uses: FB-QA/workflows/.github/workflows/claude-code-review.yml@main
# so the review logic lives once, here; an edit reaches every caller on its next PR.
# This file contains NO secrets — each caller passes its own CLAUDE_CODE_OAUTH_TOKEN.
#
# Per-repo setup (cannot be automated): install the Claude GitHub App and add the
# repo secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`).

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Claude subscription OAuth token, passed from the caller.
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Skip drafts — a review of unfinished work is just an echo.
    if: github.event.pull_request.draft == false
    # Least-privilege: contents:read means the reviewer can read and comment, never
    # commit. pull-requests/issues:write only post the review and its reactions.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write # the action mints its App token via OIDC; without this it dies early
      # actions: read lets the bundled github_ci MCP server read workflow runs and check
      # results. Without it every review logged "The github_ci MCP server requires
      # 'actions: read' permission. Skipping CI server installation." and reviewed blind —
      # unable to say whether the suite was green on the SHA it was reviewing. Read-only:
      # it cannot dispatch, cancel or re-run anything. The CALLER must grant it too, since
      # the caller's permissions are the ceiling for the token passed in here.
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history: a review that cannot see the base is guessing
          # NB: persist-credentials MUST stay at its default (true). claude-code-action
          # runs its own `git fetch origin` internally, which needs the credential in
          # .git/config; `persist-credentials: false` makes that fetch fail with exit 1 on
          # a private repo. The trade-off is that the (contents:read + PR-write) token then
          # sits in .git/config where the agent's Read tool could reach it — an accepted
          # residual on these PRIVATE repos with trusted authors (no injection author). If
          # a repo ever takes untrusted external PRs, switch to hosted Code Review.

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # Lead with the review command — the action's auto-run keys on the prompt
          # starting with it. `--comment` matters: the upstream plugin's step 7 stops
          # before posting without it, so leaving it off means posting happens only
          # because these rules outrank the plugin. The reporting rules follow. The
          # static-review rule is load-bearing: without it the review burns its turn
          # budget being denied build commands after it has already posted.
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            How to run and report this review:

            - FIRST, before reviewing, mark it in progress: add an 👀 (eyes) reaction
              to the PR description (best-effort — carry on if it fails):
                gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/reactions -f content=eyes

            - DEDUPE BEFORE YOU POST. A push is not a fresh PR. List what you have
              already said on this one:
                gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --jq '.[] | select(.user.login == "claude[bot]") | "\(.path):\(.line)"'
              Do not re-flag any file:line in that list — not reworded, not regraded,
              not under a different heading. Inline findings accumulate across every
              push and are never resolved, so a repeat is pure noise in a thread the
              author cannot prune.

            - Post EVERY finding as an INLINE review comment anchored to the exact
              file and line it concerns, using the create_inline_comment tool. Do NOT
              gather findings into one summary comment.

            - SEVERITY IS A FIXED SCALE. Grade every finding as exactly one of:
                P1 — a real user hits this and something breaks
                P2 — produces the wrong result under plausible conditions
                P3 — worth knowing, not worth blocking the merge
              Never invent a label: no "Correctness:", "Efficiency:", "Cleanup:",
              "Test gap:", "Minor:". A scale that moves between runs cannot be triaged.

            - EVERY inline comment has exactly this shape, in this order, and nothing
              else:

                **P<n> · <plain-English headline, 10 words max>** — `file.ext:line`

                <One or two sentences saying what someone using the app would see go
                wrong. Written for a reader who does not code: no identifiers, no CSS
                properties, no type or function names. If you cannot explain it without
                them, describe what the user experiences instead.>

                **Fix:** <one sentence — technical, concrete, actionable>

                <details><summary>Technical detail</summary>

                <The full analysis: evidence, line references, reasoning, git history,
                CLAUDE.md citations, suggested code, committable suggestion block if the
                fix is small and complete. Uncapped — put ALL of it here.>

                </details>

              Everything ABOVE the <details> line is capped at 60 words in total. Count
              them. The detail block is uncapped, so nothing is lost — it is folded.
              The lede is for deciding whether to care; the fold is for fixing it.

            - CAP: post at most 8 findings, highest severity first. If more survive
              validation, post those 8 and list the remainder one line each in the
              tracking comment under a "Not posted" heading.

            - Review statically. Do NOT run package-manager or build commands
              (npm/pnpm/tsc/eslint/vitest/playwright) — you will be denied, and the
              retries will exhaust your turn budget before you can post. The typecheck,
              lint and test gates run separately in ci.yml; read its result rather than
              reproducing it.

            - Beyond the checklist the action maintains for you, the tracking comment
              carries ONE line: counts by severity, e.g. "3 findings — 1 P1, 2 P2."
              Plus the "Not posted" list if the cap bit. Do not restate the findings,
              do not summarise the diff, do not narrate what you read. If nothing
              survives validation: "No issues found. Checked for bugs and CLAUDE.md
              compliance."

            - Update the tracking comment at most TWICE: once at the start, once at
              the end. Every rewrite costs a turn, and turns are the binding
              constraint here — a run that rewrites its checklist a dozen times dies
              at max-turns having posted nothing.

            - LAST, once the review is posted, mark it done by adding a 👍 (+1)
              reaction to the PR description (best-effort — carry on if it fails):
                gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/reactions -f content=+1
              Leave the 👀 in place. Do NOT try to remove it and do NOT look up its
              id: the removal needs the id in a shell variable, the sandbox cannot
              statically match a command containing one against its allowlist, and it
              is denied every single time. 👀 plus 👍 reads as "reviewed" perfectly
              well; the tidier single reaction is not worth the turns.
          track_progress: true
          # DIAGNOSTIC. The action hides the SDK transcript by default, printing only
          # "Running Claude Code via SDK (full output hidden for security)" — so when a
          # review finishes having posted nothing, WHY is unreadable.
          #
          # It is not a rare case. FB-QA/bbbk #204 ran 25 turns and reported success with
          # `permission_denials_count: 9` and no findings: it spent a third of its budget
          # being refused and gave up, and the only visible symptom was a green check with
          # nothing behind it. An entry in --allowedTools is necessary but not sufficient
          # (see the note below), so knowing WHICH command was denied is the difference
          # between fixing the allowlist and guessing at it. Run 31489080897 died the same
          # way and cost a whole session to diagnose from the outside.
          #
          # The cost: the model's output — including whatever it reads from the diff —
          # lands in the Actions log. Every repo calling this workflow is PRIVATE with
          # trusted authors (see the injection note above), so the log is already as
          # readable as the code it reviews.
          show_full_output: true
          # Agent mode grants NO tools by default and nobody can approve prompts on a
          # runner. Grant READ-ONLY tools only — the reviewer reads and comments, it does
          # not change code (contents: read). git/gh are per-subcommand, never wildcarded
          # (`git:*`/`gh:*` shell out via aliases). Only the code-review plugin's real
          # needs are allowed: gh pr/issue reads + git history for the diff; findings post
          # via MCP tools; gh api is limited to this PR's reactions and its own inline
          # comments (the dedupe read — `gh pr view --comments` returns issue comments,
          # not review comments, so it cannot serve that). Any command the prompt asks
          # for MUST have an entry here: on a runner nobody can approve a permission
          # prompt, so an ungranted command is denied, retried, and eats the turn budget
          # before anything is posted. An entry is necessary but NOT sufficient: the
          # sandbox cannot statically match a command carrying a shell variable,
          # command substitution or && / || chaining, so those are denied however
          # correct the entry looks — which is what killed run 31489080897 on
          # FB-QA/bbbk. tests/check_review_workflow.py enforces both halves.
          #
          # --max-turns was 40, and that run hit the ceiling (with 6 denials burned on
          # the reaction removal that has since been dropped). The review fans out to
          # several subagents before it posts anything; 60 leaves headroom so a slow
          # PR reports its findings instead of dying silently with them.
          # `Skill` leads the allowlist below, and it is load-bearing. The prompt
          # opens with `/code-review:code-review …`, and Claude Code now routes a
          # plugin slash command through the Skill tool. Without Skill on the
          # allowlist that invocation is DENIED, the plugin's review procedure never
          # runs, and the model improvises — inventing the very labels this prompt
          # forbids by name.
          #
          # Evidence, FB-QA/bbbk. Run 34405828482 (09-09): 49 turns, 5 denials, never
          # touched the Skill tool, findings in the required
          # `**P1 · headline** — file:line` shape. Run 34455461499 (09-10): same model,
          # same prompt, same plugin — denied Skill twice, gave up after 15 turns with
          # 30 denials, and posted six comments labelled "Correctness:",
          # "Simplification:" and "Reuse:". Of the 62 inline comments this bot has ever
          # left, 56 use the P-format; the 6 that do not are all from that one run.
          #
          # Nothing in these repositories changed. The routing of slash commands did.
          claude_args: >-
            --max-turns 60
            --allowedTools "Skill,Read,Grep,Glob,LS,Task,TodoWrite,mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git rev-parse:*),Bash(git rev-list:*),Bash(git ls-files:*),Bash(git ls-tree:*),Bash(git cat-file:*),Bash(git blame:*),Bash(git diff-tree:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Bash(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/reactions:*)"
